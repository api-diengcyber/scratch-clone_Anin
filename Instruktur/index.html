<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/webp" href="/Assets/logo.webp">
  <title>Ruang KKA — Dashboard Instruktur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="static/tailwind-config.js?v=5"></script>
  <link rel="stylesheet" href="static/admin.css?v=21">
  <link rel="stylesheet" href="static/glass.css?v=5">
  <link rel="stylesheet" href="static/frames.css?v=1">
</head>
<body class="text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col md:flex-row">
  <!-- Topbar mobile -->
  <div class="md:hidden flex items-center justify-between bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-jade-100 dark:border-slate-800 px-4 py-3 sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <img src="/Assets/logo.webp" alt="Logo Ruang KKA" width="36" height="36" class="w-9 h-9 object-contain shrink-0">
      <div>
        <span class="font-extrabold text-base tracking-tight text-slate-900 dark:text-white">Ruang<span class="text-jade-600 dark:text-jade-400">KKA</span></span>
        <span class="block text-[11px] text-jade-700 dark:text-jade-300 font-semibold">Koding dan Kecerdasan Artifisial</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" data-theme-toggle aria-label="Ganti tema" class="w-10 h-10 grid place-items-center rounded-full bg-jade-50 dark:bg-slate-800 hover:bg-jade-100 transition">
        <i class="fa-solid fa-sun text-amber-500 dark:hidden text-sm"></i><i class="fa-solid fa-moon text-jade-300 hidden dark:block text-sm"></i>
      </button>
      <button id="mobileMenuBtn" type="button" aria-label="Buka menu" class="w-10 h-10 grid place-items-center rounded-full text-slate-600 dark:text-slate-300 bg-jade-50 dark:bg-slate-800 hover:bg-jade-100 transition"><i class="fa-solid fa-bars text-base"></i></button>
    </div>
  </div>
  <div id="sbBackdrop" class="sb-backdrop" aria-hidden="true"></div>

  <aside id="sidebar" class="hidden md:flex flex-col w-full md:w-72 bg-white dark:bg-slate-900 shrink-0 select-none transition-all duration-300 z-40">
    <button id="sbToggle" type="button" aria-controls="sidebar" aria-expanded="true" title="Ciutkan / buka menu"><i class="fa-solid fa-chevron-left"></i></button>
    <div id="sidebarBrand" class="h-[4.5rem] px-6 shrink-0 flex items-center gap-3">
      <img src="/Assets/logo.webp" alt="Logo Ruang KKA" width="40" height="40" class="w-10 h-10 object-contain shrink-0">
      <div class="leading-tight">
        <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Ruang<span class="text-jade-600 dark:text-jade-400">KKA</span></span>
        <p class="text-[11px] text-slate-400 dark:text-slate-500 font-medium">Koding dan Kecerdasan Artifisial</p>
      </div>
    </div>
    <nav id="sidebarNav" class="px-4 pt-2 pb-4 flex-1 space-y-1 overflow-y-auto">
      <div class="nav-title">Menu</div>
      <a href="#" data-view="dashboard" class="nav-link group flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-sm"><i class="fa-solid fa-chart-pie w-4 text-center text-sm"></i><span>Ringkasan</span></a>
      <a href="#" data-view="tugas" class="nav-link group flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-sm"><i class="fa-solid fa-list-check w-4 text-center text-sm"></i><span>Tugas Tambahan</span></a>
      <a href="#" data-view="ujian" class="nav-link group flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-sm"><i class="fa-solid fa-graduation-cap w-4 text-center text-sm"></i><span>Ujian Kelulusan</span></a>
      <a href="#" data-view="jadwal" class="nav-link group flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-sm"><i class="fa-solid fa-video w-4 text-center text-sm"></i><span>Jadwal Zoom Mentoring</span></a>
      <a href="#" data-view="rekap" class="nav-link group flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-sm"><i class="fa-solid fa-user-check w-4 text-center text-sm"></i><span>Rekap Absen</span></a>
    </nav>
    <div id="sidebarFoot" class="px-4 pb-4 pt-2 space-y-3">
      <div id="sidebarPromo" class="promo-card">
        <button type="button" id="promoClose" aria-label="Tutup" class="promo-close"><i class="fa-solid fa-xmark"></i></button>
        <p class="text-[13px] font-extrabold text-slate-900 dark:text-white">Jadwal Baru</p>
        <p class="text-[11px] leading-relaxed text-slate-500 dark:text-slate-400 mt-1 pr-4">Atur kelas Zoom mentoring untuk siswa.</p>
        <div class="promo-art" aria-hidden="true"><i class="fa-solid fa-video"></i><span>&lt;/&gt;</span></div>
        <button type="button" data-view="jadwal" class="promo-btn">Tambah Jadwal</button>
      </div>
      <div class="flex items-center gap-3 p-2 rounded-2xl bg-jade-50/70 dark:bg-slate-800/70">
        <div id="sidebarAvatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-jade-400 to-jade-600 text-white flex items-center justify-center font-bold text-sm shrink-0">..</div>
        <div class="flex-1 min-w-0">
          <p id="sidebarName" class="text-xs font-bold text-slate-900 dark:text-white truncate">Memuat...</p>
          <span class="text-[11px] text-jade-700 dark:text-jade-300 font-medium flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-jade-500 shrink-0"></span> <span class="truncate">Instruktur</span></span>
        </div>
        <button id="btnLogout" type="button" title="Keluar Akun" aria-label="Keluar Akun" class="text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 transition p-1.5"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button>
      </div>
    </div>
  </aside>

  <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <header class="topbar h-[4.5rem] flex items-center justify-between sticky top-0 z-30 px-4 md:px-8">
      <div class="flex items-center gap-3 flex-1" style="max-width:26rem">
        <div class="relative w-full">
          <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-jade-600/70 text-xs"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input type="text" id="globalSearch" placeholder="Cari tugas, ujian, atau jadwal..." class="w-full bg-white dark:bg-slate-800/70 border border-jade-100 dark:border-slate-700 shadow-soft text-xs sm:text-sm rounded-full pl-10 pr-4 py-2.5 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-jade-500/15 focus:border-jade-400 transition-all font-medium">
        </div>
      </div>
      <div class="flex items-center gap-2.5 sm:gap-3 ml-auto pl-3">
        <button type="button" data-theme-toggle class="top-icon-btn hidden md:grid" aria-label="Ganti mode tampilan" title="Ganti Mode Tampilan (Light / Dark)">
          <i class="fa-solid fa-sun text-amber-500 dark:hidden text-sm"></i><i class="fa-solid fa-moon text-jade-300 hidden dark:block text-sm"></i>
        </button>
        <span class="hidden sm:block w-px h-7 bg-jade-200/70 dark:bg-slate-700"></span>
        <div class="flex items-center gap-2.5 pl-1 pr-2 py-1">
          <span id="topAvatar" class="w-9 h-9 rounded-full bg-gradient-to-br from-jade-400 to-jade-600 text-white grid place-items-center text-xs font-bold ring-2 ring-white dark:ring-slate-800 shadow-soft">..</span>
        </div>
      </div>
    </header>
    <div id="view-dashboard" class="dc-dashboard px-4 pb-8 pt-2 md:px-8 space-y-6"></div>
    <div id="view-tugas" class="hidden px-4 pb-8 pt-2 md:px-8 space-y-6"></div>
    <div id="view-ujian" class="hidden px-4 pb-8 pt-2 md:px-8 space-y-6"></div>
    <div id="view-jadwal" class="hidden px-4 pb-8 pt-2 md:px-8 space-y-6"></div>
    <div id="view-rekap" class="hidden px-4 pb-8 pt-2 md:px-8 space-y-6"></div>
  </main>

  <div id="toast" role="status" aria-live="polite" class="fixed bottom-5 left-4 right-4 sm:left-auto sm:right-5 sm:max-w-sm z-[90] flex items-center gap-3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-xl px-4 py-3 text-sm translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
    <span id="toastBadge" class="w-7 h-7 shrink-0 rounded-full flex items-center justify-center text-xs bg-emerald-100 text-emerald-600"><i class="fa-solid fa-check"></i></span>
    <span id="toastMessage" class="leading-snug"></span>
  </div>

  <script src="static/admin-api.js?v=6"></script>
  <script src="static/common.js?v=2"></script>
  <script src="static/dialog.js?v=2"></script>
  <script>window.DC_REKAP_DEMO = true;   // rekap absen contoh tanpa backend; hapus kalau endpoint sudah siap</script>
  <script src="static/rekap-absen.js?v=2"></script>
  <script src="static/instruktur.js?v=2"></script>
</body>
</html>
