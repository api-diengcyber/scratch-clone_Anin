<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurikulum SMP • Dieng Cyber Coding</title>
  <link rel="stylesheet" href="smp.css?v=1">

<body>

  <main>
    <section class="hero">
      <p class="eyebrow">JENJANG SMP • USIA 13–15 TAHUN</p>

      <div class="grid" id="showcase"></div>
