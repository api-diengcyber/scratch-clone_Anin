<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>Scratch Studio Clone</title>
  <link rel="stylesheet" href="style.css?v=20261014a">
</head>

<body>

  <!-- =====================================================
       MODAL LOGIN
       ===================================================== -->
  <div id="login-overlay" class="overlay hidden">
    <div class="login-card">
      <h2>Selamat Datang di Scratch Studio</h2>
      <p>Silakan masuk untuk melanjutkan proyek Anda</p>

      <form id="login-form">

        <div class="input-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            placeholder="Masukkan username"
            autocomplete="username"
            required
          >
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          >
        </div>

        <div
          id="login-error"
          class="error-msg"
          style="display: none;"
        >
          Username dan Password wajib diisi!
        </div>

        <button type="submit" class="btn-primary">
          Masuk
        </button>

      </form>
    </div>
  </div>


  <!-- =====================================================
       NAVBAR
       ===================================================== -->
  <header class="navbar">

    <div class="nav-left">

      <span class="logo">
        Scratch Web
      </span>

      <div class="nav-controls">

        <button
          id="green-flag-btn"
          class="btn-icon btn-green"
          title="Jalankan Skrip"
          aria-label="Jalankan Skrip"
          type="button"
        >
          🚩
        </button>

        <button
          id="stop-btn"
          class="btn-icon btn-red"
          title="Hentikan Skrip"
          aria-label="Hentikan Skrip"
          type="button"
        >
          🛑
        </button>

        <button
          id="clear-ws-btn"
          class="btn-secondary"
          type="button"
        >
          Bersihkan Area Kerja
        </button>

      </div>

    </div>


    <div class="nav-right">

      <div
        id="user-badge"
        class="user-badge"
        style="display: none;"
      >
        <span>
          Halo,
          <strong id="user-display-name">User</strong>
        </span>

        <button
          id="logout-btn"
          class="btn-link"
          type="button"
        >
          ← Dashboard
        </button>
      </div>

    </div>

  </header>


  <!-- =====================================================
       APP CONTAINER
       ===================================================== -->
  <main class="app-container">


    <!-- ===================================================
         SIDEBAR KATEGORI
         =================================================== -->
    <aside
      class="sidebar-categories"
      aria-label="Kategori blok"
    >

      <div
        class="cat-item active"
        data-cat="motion"
        role="button"
        tabindex="0"
      >
        <span class="dot dot-motion"></span>
        <span>Motion</span>
      </div>

      <div
        class="cat-item"
        data-cat="looks"
        role="button"
        tabindex="0"
      >
        <span class="dot dot-looks"></span>
        <span>Looks</span>
      </div>

      <div
        class="cat-item"
        data-cat="sound"
        role="button"
        tabindex="0"
      >
        <span class="dot dot-sound"></span>
        <span>Sound</span>
      </div>

      <div
        class="cat-item"
        data-cat="events"
        role="button"
        tabindex="0"
      >
        <span class="dot dot-events"></span>
        <span>Events</span>
      </div>

      <div
        class="cat-item"
        data-cat="control"
        role="button"
        tabindex="0"
      >
        <span class="dot dot-control"></span>
        <span>Control</span>
      </div>

      <div
        class="cat-item"
        data-cat="sensing"
        role="button"
        tabindex="0"
      >
        <span class="dot dot-sensing"></span>
        <span>Sensing</span>
      </div>

      <div
        class="cat-item"
        data-cat="operators"
        role="button"
        tabindex="0"
      >
        <span class="dot dot-operators"></span>
        <span>Operators</span>
      </div>

      <div
        class="cat-item"
        data-cat="variables"
        role="button"
        tabindex="0"
      >
        <span class="dot dot-variables"></span>
        <span>Variables</span>
      </div>

      <div
        class="cat-item"
        data-cat="myblocks"
        role="button"
        tabindex="0"
      >
        <span class="dot dot-myblocks"></span>
        <span>My Blocks</span>
      </div>

    </aside>


    <!-- ===================================================
         PALETTE BLOK
         =================================================== -->
    <section
      class="palette-panel"
      id="palette-scroll"
      aria-label="Daftar blok"
    >
      <!--
        Blok akan dibuat otomatis oleh script.js
      -->
    </section>


    <!-- ===================================================
         WORKSPACE / SCRIPT AREA
         =================================================== -->
    <section class="workspace-panel">

      <div class="workspace-header workspace-tabs" role="tablist" aria-label="Tab area kerja">
        <button id="tab-code" class="ws-tab active" type="button" role="tab" aria-selected="true">Kode</button>
        <button id="tab-sounds" class="ws-tab" type="button" role="tab" aria-selected="false">🔊 Suara</button>
        <span class="workspace-hint">Seret &amp; tempatkan blok di tab Kode</span>
      </div>

      <div
        id="script-area"
        class="script-area"
      >
        <div
          id="workspace-canvas"
          class="workspace-canvas"
        ></div>

        <div
          class="workspace-zoom-controls"
          aria-label="Kontrol zoom area kerja"
        >
          <button id="workspace-zoom-in" class="workspace-zoom-btn" type="button" title="Zoom In" aria-label="Zoom In">+</button>
          <button id="workspace-zoom-out" class="workspace-zoom-btn" type="button" title="Zoom Out" aria-label="Zoom Out">−</button>
          <button id="workspace-zoom-reset" class="workspace-zoom-btn" type="button" title="Reset Zoom" aria-label="Reset Zoom">=</button>
        </div>
      </div>

      <!-- TAB SUARA: daftar suara, ganti nama, trim, hapus, rekam -->
      <div id="sounds-panel" class="sounds-panel" hidden>
        <div class="sounds-list-col">
          <div id="sounds-list" class="sounds-list" aria-label="Daftar suara"></div>
          <button id="sounds-record-btn" class="sounds-record-btn" type="button">🎤 Rekam</button>
        </div>
        <div id="sounds-editor" class="sounds-editor"></div>
      </div>

    </section>


    <!-- ===================================================
         STAGE PANEL
         =================================================== -->
    <section class="stage-panel">

      <div class="stage-wrapper">

        <canvas
          id="stage"
          width="480"
          height="360"
        ></canvas>

        <div
          id="say-bubble"
          class="say-bubble"
        ></div>

        <div class="variable-monitor">
          <span class="var-title">
            score:
          </span>

          <span
            id="var-val-score"
            class="var-value"
          >
            0
          </span>
        </div>

      </div>


      <!-- ===============================================
           SPRITE INFORMATION
           =============================================== -->
      <div class="sprite-controls">

        <div class="control-row">
          <label>
            Sprite:
            <input
              type="text"
              value="Kucing"
              readonly
            >
          </label>
        </div>

        <div class="control-row">

          <label>
            X:
            <input
              type="number"
              id="sprite-x"
              value="0"
              readonly
            >
          </label>

          <label>
            Y:
            <input
              type="number"
              id="sprite-y"
              value="0"
              readonly
            >
          </label>

        </div>

        <div class="control-row">

          <label>
            Arah:
            <input
              type="number"
              id="sprite-dir"
              value="90"
              readonly
            >
          </label>

          <label>
            Ukuran:
            <input
              type="number"
              id="sprite-size"
              value="100"
              readonly
            >
          </label>

        </div>

      </div>

      <!-- ===============================================
           SPRITE & BACKDROP PANEL (ala Scratch)
           =============================================== -->
      <div class="assets-panel">

        <div class="sprite-pane">
          <div class="pane-title">Sprite</div>
          <div id="sprite-list" class="sprite-list"></div>
          <button id="add-sprite-btn" class="fab-btn" type="button" title="Pilih Sprite">🐱＋</button>
        </div>

        <div class="backdrop-pane">
          <div class="pane-title">Backdrop</div>
          <div id="backdrop-preview" class="backdrop-preview"></div>
          <div id="backdrop-name" class="backdrop-name"></div>
          <button id="add-backdrop-btn" class="fab-btn" type="button" title="Pilih Backdrop">🖼️＋</button>
        </div>

      </div>

    </section>

  </main>

  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->
  <script src="/kurikulum/data/jalur-data.js?v=12"></script>
  <script src="/kurikulum/core/jalur-belajar.js?v=13"></script>
  <script src="/shared/js/materi-gate.js?v=2"></script>
  <script src="script.js?v=12"></script>

</body>
</html>
