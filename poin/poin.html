
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/shared/js/theme.js?v=20261019"></script>
  <title>Koin Belajar • Dieng Cyber Coding</title>
  <meta name="description" content="Koin Belajar Dieng Cyber Coding: lihat poin dan lencanamu, lalu tukar dengan bingkai avatar dan gelar di Toko Hadiah.">
  <link rel="icon" type="image/webp" href="/Assets/logo.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/shared/css/frames.css?v=20261019">
  <link rel="stylesheet" href="/shared/css/tailwind.generated.css?v=20261019">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-width: 0;
      overflow-x: clip;
      -webkit-text-size-adjust: 100%;
    }

    main, header, footer, #hero, #panel {
      max-width: 100%;
      min-width: 0;
    }

    #tabs {
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    #tabs button {
      flex-shrink: 0;
      white-space: nowrap;
      min-height: 42px;
    }

    #hero, #panel {
      overflow-wrap: anywhere;
    }

    #hero img, #panel img {
      max-width: 100%;
    }

    #panel button {
      overflow-wrap: anywhere;
      touch-action: manipulation;
    }

    #modalConfirm {
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    #modalConfirm > div {
      width: 100%;
      max-width: 448px;
      max-height: calc(100dvh - 2rem);
      overflow-y: auto;
    }

    #toastNotification {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    @media (max-width: 640px) {
      header > div {
        padding: 0.65rem 0.75rem;
        gap: 0.5rem;
      }

      header a[href="/dashboard.html"] {
        padding: 0.4rem 0.55rem;
        gap: 0.35rem;
        border-radius: 0.85rem;
      }

      #quickSaldo {
        font-size: 0.75rem;
      }

      main {
        padding: 1rem 0.75rem;
        gap: 1rem;
      }

      #hero {
        padding: 1.25rem 1rem;
        border-radius: 1.25rem;
      }

      #panel {
        padding: 1rem;
        border-radius: 1.25rem;
        min-height: 300px;
      }

      #panel h3 {
        font-size: 1rem;
        line-height: 1.5;
      }

      #panel .grid {
        gap: 0.85rem;
      }

      #panel .grid > div {
        min-width: 0;
      }

      #modalConfirm {
        padding: 0.75rem;
      }

      #modalConfirm > div {
        padding: 1.25rem;
        border-width: 3px;
        border-radius: 1.5rem;
      }

      #modalConfirm .mt-6 {
        gap: 0.5rem;
      }

      #modalConfirm button {
        min-height: 44px;
        padding: 0.7rem 0.5rem;
        font-size: 0.8rem;
      }

      body > div.fixed.bottom-6.right-6 {
        left: 0;
        right: 0;
        bottom: max(0.75rem, env(safe-area-inset-bottom));
        width: 100%;
        max-width: 100%;
        padding: 0 0.75rem;
      }

      footer {
        padding: 1rem 0.75rem;
        line-height: 1.6;
      }
    }

    @media (max-width: 360px) {
      #quickSaldo {
        font-size: 0.7rem;
      }

      #hero h2 {
        font-size: 1.35rem;
      }

      #modalConfirm > div {
        padding: 1rem;
      }

      #modalConfirm .mt-6 {
        flex-direction: column;
      }

      #modalConfirm .mt-6 button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body class="bg-gradient-to-b from-sky-50/70 via-indigo-50/40 to-slate-100 min-h-screen text-slate-800 antialiased flex flex-col font-sans selection:bg-amber-200">

  <!-- HEADER -->
  <header class="w-full bg-white/95 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-40 shadow-sm">
    <div class="w-full max-w-7xl mx-auto px-3 sm:px-8 py-3.5 flex items-center justify-between gap-2 sm:gap-4">

      <div class="flex items-center gap-3 sm:gap-5 min-w-0">
        <a href="/dashboard.html"
           class="group inline-flex items-center gap-2 px-3.5 py-2 rounded-2xl bg-slate-100 hover:bg-sky-50 text-slate-700 hover:text-brand-600 font-bold text-xs sm:text-sm transition-all border border-slate-200 hover:border-sky-300 active:scale-95">
          <span class="w-7 h-7 rounded-xl bg-white text-brand-600 flex items-center justify-center font-black">←</span>
          <span class="hidden sm:inline">Dashboard</span>
          <span class="sm:hidden">Kembali</span>
        </a>

        <div class="hidden sm:flex items-center gap-2.5 pl-3 border-l border-slate-200">
          <div class="w-9 h-9 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-xl border border-amber-200">🪙</div>
          <div>
            <h1 class="text-sm sm:text-base font-extrabold text-slate-900 font-display">
              Koin Belajar
            </h1>
            <p class="text-[11px] text-slate-400 font-medium">
              Kumpulkan koin dan hias avatar favoritmu!
            </p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3 flex-none">
        <div class="flex items-center gap-1.5 bg-amber-50 border border-amber-200/70 px-2.5 sm:px-3.5 py-1.5 rounded-2xl">
          <span class="text-base">💰</span>
          <span id="quickSaldo" class="text-xs sm:text-sm font-extrabold text-amber-800">0</span>
          <span class="text-[10px] text-amber-600 font-semibold hidden sm:inline">Koin Belajar</span>
        </div>

        <div class="flex items-center gap-2.5">
          <div class="text-right hidden sm:block">
            <p id="hdrName" class="text-sm font-bold text-slate-800 leading-tight">&nbsp;</p>
            <p id="hdrGelar" class="text-[11px] text-slate-400 font-medium">Belajar • Bermain • Berkarya</p>
          </div>
          <div id="hdrAvatar" class="flex-none"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA -->
  <main class="w-full flex-1 max-w-7xl mx-auto px-4 sm:px-8 py-6 space-y-6">

    <section id="hero"
      class="w-full relative overflow-hidden rounded-3xl bg-gradient-to-r from-indigo-600 via-purple-600 to-sky-600 text-white p-6 sm:p-8 shadow-xl">
    </section>

    <nav class="flex items-center gap-2 overflow-x-auto pb-1 pt-1" id="tabs"></nav>

    <section id="panel"
      class="bg-white rounded-3xl p-5 sm:p-8 border border-slate-200/80 shadow-sm min-h-[420px]">
    </section>

  </main>

  <!-- MODAL KONFIRMASI -->
  <div id="modalConfirm"
    class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">

    <div class="bg-white rounded-3xl max-w-md w-full p-6 text-center shadow-2xl border-4 border-amber-200">
      <div class="w-16 h-16 rounded-3xl bg-amber-100 text-amber-600 mx-auto flex items-center justify-center text-3xl mb-4">
        🎁
      </div>

      <h3 class="text-xl font-extrabold text-slate-800" id="modalTitle">
        Tukar Hadiah?
      </h3>

      <p class="text-sm text-slate-600 mt-2" id="modalDesc"></p>

      <div class="mt-6 flex gap-3">
        <button id="modalBtnCancel" type="button"
          class="flex-1 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm">
          Batal
        </button>

        <button id="modalBtnConfirm" type="button"
          class="flex-1 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-sm shadow-md">
          Tukar Sekarang! ✨
        </button>
      </div>
    </div>
  </div>

  <!-- NOTIFIKASI -->
  <div class="fixed bottom-6 right-6 z-50 max-w-md w-full px-4 pointer-events-none">
    <div id="toastNotification"
      class="hidden pointer-events-auto rounded-2xl p-4 text-sm font-semibold flex items-center justify-between shadow-xl border bg-white">

      <div class="flex items-center gap-3 min-w-0">
        <span id="toastIcon" class="text-xl">✨</span>
        <span id="toastMsg">Pemberitahuan</span>
      </div>

      <button type="button" id="toastClose"
        class="text-slate-400 hover:text-slate-700 font-bold text-xs ml-3 px-1.5 py-0.5">
        ✕
      </button>
    </div>
  </div>

  <footer class="w-full bg-white border-t border-slate-200/80 py-4 px-4 sm:px-8 mt-auto text-center text-xs font-semibold text-slate-400">
    &copy; Dieng Cyber Coding &bull; Platform Belajar Koding Interaktif untuk Generasi Juara
  </footer>

  <script src="/kurikulum/data/jalur-data.js?v=20261019"></script>
  <script src="/kurikulum/core/jalur-belajar.js?v=20261019"></script>
  <script src="/shared/js/avatar-frame.js?v=20261019"></script>

  <script src="/shared/js/utils.js?v=20261019"></script>
  <script>
  (function () {
    if (!localStorage.getItem("authToken")) {
      location.replace("/index.html");
      return;
    }

    const $ = (id) => document.getElementById(id);

    const esc = window.DCUtils.esc;

    if (typeof window.LP === "undefined") {
      $("panel").innerHTML = `
        <div class="p-6 text-center">
          <div class="text-4xl mb-3">⚠️</div>
          <h3 class="font-extrabold text-slate-800">Data belajar belum tersedia</h3>
          <p class="text-sm text-slate-500 mt-2">
            Silakan muat ulang halaman atau kembali ke dashboard.
          </p>
          <a href="/dashboard.html"
            class="inline-block mt-4 px-5 py-3 rounded-xl bg-sky-600 text-white font-bold text-sm">
            Kembali ke Dashboard
          </a>
        </div>`;
      return;
    }

    const EXTRA_FRAMES = (LP.HADIAH || []).filter(item => item.jenis === "bingkai");
    const EXTRA_TITLES = (LP.HADIAH || []).filter(item => item.jenis === "gelar");

    let currentTab = "tukar";
    let pendingItem = null;
    let toastTimer = null;

    function loadProfile() {
      try {
        return JSON.parse(localStorage.getItem("profile_" + LP.user())) || {};
      } catch (error) {
        return {};
      }
    }

    function userAvatarInner() {
      const profile = loadProfile();

      if (profile.avatar) {
        return `<img src="${esc(profile.avatar)}" alt="Foto profil" width="112" height="112">`;
      }

      const username = LP.user() || "A";
      return `<span style="color:#fff;font-weight:800">${esc(username.charAt(0).toUpperCase())}</span>`;
    }

    function userName() {
      const profile = loadProfile();
      return profile.fullName || "@" + LP.user();
    }

    function activeFrame() {
      return LP.hadiahAktif ? LP.hadiahAktif().bingkai : null;
    }

    function activeGelar() {
      return LP.hadiahAktif ? LP.hadiahAktif().gelar : null;
    }

    function getSaldo() {
      return Number(LP.saldo ? LP.saldo() : 0) || 0;
    }

    function showToast(message, type = "success") {
      clearTimeout(toastTimer);

      const toast = $("toastNotification");
      $("toastMsg").textContent = message;
      $("toastIcon").textContent =
        type === "success" ? "🎉" :
        type === "error" ? "⚠️" : "✨";

      toast.className =
        "pointer-events-auto rounded-2xl p-4 text-sm font-semibold flex items-center justify-between shadow-xl border " +
        (type === "success"
          ? "bg-emerald-50 text-emerald-900 border-emerald-200"
          : type === "error"
          ? "bg-rose-50 text-rose-900 border-rose-200"
          : "bg-sky-50 text-sky-900 border-sky-200");

      toast.classList.remove("hidden");

      toastTimer = setTimeout(() => {
        toast.classList.add("hidden");
      }, 3500);
    }

    window.closeToast = () => {
      $("toastNotification").classList.add("hidden");
    };
    $("toastClose").addEventListener("click", window.closeToast);

    function renderAvatarWithFrame(inner, frameId, size, fontSize) {
      const frame = EXTRA_FRAMES.find(item => item.id === frameId) || null;

      if (!window.AvatarFrame || !AvatarFrame.markup) {
        return `
          <div class="w-20 h-20 rounded-full bg-sky-500 flex items-center justify-center text-4xl">
            ${inner}
          </div>`;
      }

      return AvatarFrame.markup(inner, frame, {
        size: size,
        fs: fontSize
      });
    }

    function renderHeaderUser() {
      const title = activeGelar();

      $("hdrName").textContent = userName();
      $("hdrGelar").textContent = title
        ? title.emoji + " " + title.nama
        : "Belajar • Bermain • Berkarya";

      if (window.AvatarFrame && AvatarFrame.markup) {
        $("hdrAvatar").innerHTML = AvatarFrame.markup(
          userAvatarInner(),
          activeFrame(),
          { size: 40, fs: "1rem", ornaments: false }
        );
      } else {
        $("hdrAvatar").innerHTML = userAvatarInner();
      }
    }

    function renderHero() {
      const balance = getSaldo();
      const title = activeGelar();

      $("quickSaldo").textContent = balance;

      $("hero").innerHTML = `
        <div class="flex flex-col md:flex-row items-center gap-6 relative z-10">

          <div class="relative flex-none">
            ${renderAvatarWithFrame(userAvatarInner(), activeFrame(), 112, "3rem")}
          </div>

          <div class="flex-1 text-center md:text-left min-w-0">
            <p class="text-sm text-sky-100 font-semibold mb-1">
              Hai, selamat datang!
            </p>

            <h2 class="text-2xl sm:text-3xl font-extrabold font-display leading-tight break-words">
              ${esc(userName())}
            </h2>

            <p class="text-sm text-sky-100 mt-2">
              Terus belajar dan kumpulkan Koin Belajar untuk membuka hadiah menarik!
            </p>

            ${title ? `
              <div class="inline-flex items-center gap-2 px-3 py-1 mt-3 rounded-xl bg-amber-400/25 border border-amber-300/40 text-amber-100 text-xs sm:text-sm font-bold">
                ${esc(title.emoji)} ${esc(title.nama)}
              </div>
            ` : ""}

            <div class="mt-5 inline-flex items-center gap-3 bg-white/15 backdrop-blur-md border border-white/20 rounded-2xl px-5 py-3">
              <div class="w-12 h-12 rounded-2xl bg-amber-400 flex items-center justify-center text-2xl shadow-sm">
                💰
              </div>
              <div class="text-left">
                <p class="text-xs text-sky-100 font-semibold">Saldo Koin Belajar</p>
                <p class="text-2xl font-black text-amber-300">${balance} <span class="text-sm">koin</span></p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderTabs() {
      const tabs = [
        ["tukar", "🎁 Toko Hadiah"],
        ["lencana", "🏅 Lencana"]
      ];

      $("tabs").innerHTML = tabs.map(tab => `
        <button
          type="button"
          data-tab="${tab[0]}"
          class="flex-none px-4 sm:px-5 py-2.5 rounded-2xl font-bold text-xs sm:text-sm transition-all border ${
            tab[0] === currentTab
              ? "bg-brand-600 text-white border-brand-600 shadow-md"
              : "bg-white text-slate-600 border-slate-200 hover:bg-sky-50"
          }">
          ${tab[1]}
        </button>
      `).join("");
    }

    function renderStore() {
      const owned = LP.hadiahMilik ? LP.hadiahMilik() : [];
      const equipped = LP.hadiahPakai ? LP.hadiahPakai() : {};
      const balance = getSaldo();

      let html = `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pb-4 border-b border-slate-100 mb-6">
          <div>
            <h3 class="text-xl font-extrabold text-slate-800 font-display flex items-center gap-2">
              🎁 Toko Hadiah
            </h3>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">
              Gunakan Koin Belajar untuk membuka bingkai avatar dan gelar favoritmu.
            </p>
          </div>

          <div class="inline-flex items-center justify-center gap-2 px-4 py-2 rounded-2xl bg-amber-100 text-amber-900 font-black text-sm border border-amber-200">
            <span>💰</span>
            <span>Saldo: ${balance} Koin</span>
          </div>
        </div>
      `;

      html += `
        <div class="mb-8">
          <div class="mb-4">
            <h4 class="text-base font-extrabold text-slate-800 flex items-center gap-2">
              🖼️ Bingkai Avatar
            </h4>
            <p class="text-xs text-slate-400 mt-1">
              Hias avatar dengan bingkai karakter dan efek interaktif.
            </p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
      `;

      if (EXTRA_FRAMES.length === 0) {
        html += `
          <div class="col-span-full p-6 rounded-2xl bg-slate-50 text-center text-sm text-slate-500">
            Belum ada bingkai avatar yang tersedia.
          </div>`;
      }

      html += EXTRA_FRAMES.map(frame => {
        const isOwned = owned.includes(frame.id);
        const isActive = equipped.bingkai === frame.id;
        const canAfford = balance >= Number(frame.harga || 0);

        let button = "";

        if (!isOwned) {
          button = `
            <button type="button"
              data-act="beli" data-id="${esc(frame.id)}"
              ${!canAfford ? "disabled" : ""}
              class="w-full py-2.5 px-3 rounded-xl font-bold text-xs transition-all ${
                canAfford
                  ? "bg-amber-500 hover:bg-amber-600 text-white shadow-md"
                  : "bg-slate-100 text-slate-400 cursor-not-allowed"
              }">
              ${canAfford
                ? `Tukar (${Number(frame.harga || 0)} Koin)`
                : "Koin Belajar Belum Cukup"}
            </button>`;
        } else if (isActive) {
          button = `
            <button type="button" data-act="lepas" data-jenis="bingkai"
              class="w-full py-2.5 px-3 rounded-xl font-bold text-xs bg-emerald-100 hover:bg-rose-100 text-emerald-700 hover:text-rose-700 border border-emerald-300">
              ✔ Sedang Dipakai · Lepas
            </button>`;
        } else {
          button = `
            <button type="button" data-act="pakai" data-id="${esc(frame.id)}"
              class="w-full py-2.5 px-3 rounded-xl font-bold text-xs bg-brand-600 hover:bg-brand-700 text-white shadow-md">
              Pakai Bingkai
            </button>`;
        }

        return `
          <div class="p-5 rounded-3xl border-2 transition-all flex flex-col justify-between items-center text-center relative ${
            isActive
              ? "bg-emerald-50/50 border-emerald-400 shadow-md"
              : "bg-white border-slate-200 hover:border-sky-300 shadow-sm"
          }">

            ${isActive ? `
              <span class="absolute top-3 right-3 text-[10px] font-black bg-emerald-500 text-white px-2 py-1 rounded-full">
                DIPAKAI
              </span>` : ""}

            <div class="my-3 w-full flex flex-col items-center">
              <div class="py-2">
                ${renderAvatarWithFrame("🤖", frame.id, 80, "2.25rem")}
              </div>

              <h5 class="font-extrabold text-slate-800 text-sm mt-3 mb-1">
                ${esc(frame.nama)}
              </h5>

              <p class="text-[11px] text-slate-400 mb-3 max-w-[200px] leading-relaxed">
                ${esc(frame.desc || "Bingkai avatar untuk profilmu.")}
              </p>

              <div class="text-xs font-bold ${isOwned ? "text-emerald-600" : "text-amber-600"} mb-3">
                ${isOwned
                  ? "✅ Sudah Dimiliki"
                  : `💰 ${Number(frame.harga || 0)} Koin Belajar`}
              </div>
            </div>

            ${button}
          </div>`;
      }).join("");

      html += `
          </div>
        </div>
      `;

      html += `
        <div class="mb-4">
          <div class="mb-4">
            <h4 class="text-base font-extrabold text-slate-800 flex items-center gap-2">
              🏷️ Gelar dan Julukan
            </h4>
            <p class="text-xs text-slate-400 mt-1">
              Tampilkan julukan pilihanmu di samping profil belajar.
            </p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
      `;

      if (EXTRA_TITLES.length === 0) {
        html += `
          <div class="col-span-full p-6 rounded-2xl bg-slate-50 text-center text-sm text-slate-500">
            Belum ada gelar yang tersedia.
          </div>`;
      }

      html += EXTRA_TITLES.map(title => {
        const isOwned = owned.includes(title.id);
        const isActive = equipped.gelar === title.id;
        const canAfford = balance >= Number(title.harga || 0);

        let button = "";

        if (!isOwned) {
          button = `
            <button type="button"
              data-act="beli" data-id="${esc(title.id)}"
              ${!canAfford ? "disabled" : ""}
              class="w-full py-2.5 px-3 rounded-xl font-bold text-xs transition-all ${
                canAfford
                  ? "bg-amber-500 hover:bg-amber-600 text-white shadow-md"
                  : "bg-slate-100 text-slate-400 cursor-not-allowed"
              }">
              ${canAfford
                ? `Tukar (${Number(title.harga || 0)} Koin)`
                : "Koin Belajar Belum Cukup"}
            </button>`;
        } else if (isActive) {
          button = `
            <button type="button" data-act="lepas" data-jenis="gelar"
              class="w-full py-2.5 px-3 rounded-xl font-bold text-xs bg-emerald-100 hover:bg-rose-100 text-emerald-700 hover:text-rose-700 border border-emerald-300">
              ✔ Sedang Dipakai · Lepas
            </button>`;
        } else {
          button = `
            <button type="button" data-act="pakai" data-id="${esc(title.id)}"
              class="w-full py-2.5 px-3 rounded-xl font-bold text-xs bg-brand-600 hover:bg-brand-700 text-white shadow-md">
              Pakai Gelar
            </button>`;
        }

        return `
          <div class="p-5 rounded-3xl border-2 transition-all flex flex-col justify-between items-center text-center relative ${
            isActive
              ? "bg-emerald-50/50 border-emerald-400 shadow-md"
              : "bg-white border-slate-200 hover:border-sky-300 shadow-sm"
          }">

            ${isActive ? `
              <span class="absolute top-3 right-3 text-[10px] font-black bg-emerald-500 text-white px-2 py-1 rounded-full">
                DIPAKAI
              </span>` : ""}

            <div class="my-3">
              <div class="w-14 h-14 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-3xl mx-auto mb-3 shadow-inner">
                ${esc(title.emoji || "🏷️")}
              </div>

              <h5 class="font-extrabold text-slate-800 text-sm mb-2">
                ${esc(title.nama)}
              </h5>

              <div class="text-xs font-bold ${isOwned ? "text-emerald-600" : "text-amber-600"} mb-3">
                ${isOwned
                  ? "✅ Sudah Dimiliki"
                  : `💰 ${Number(title.harga || 0)} Koin Belajar`}
              </div>
            </div>

            ${button}
          </div>`;
      }).join("");

      html += `
          </div>
        </div>
      `;

      return html;
    }

    function renderBadges() {
      return `
        <div class="pb-4 border-b border-slate-100 mb-5">
          <h3 class="text-lg font-extrabold text-slate-800 font-display flex items-center gap-2">
            🏅 Koleksi Lencana
          </h3>
          <p class="text-sm text-slate-500 mt-1">
            Lihat pencapaian yang kamu dapatkan selama belajar.
          </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          <div class="p-4 rounded-3xl bg-amber-50 border-2 border-amber-200 flex items-center gap-3">
            <span class="text-3xl">🏅</span>
            <div>
              <h4 class="text-sm font-extrabold text-amber-900">Kreator Muda</h4>
              <small class="text-amber-700">Telah Diraih ✨</small>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      renderHeaderUser();
      renderHero();
      renderTabs();

      $("panel").innerHTML = currentTab === "lencana"
        ? renderBadges()
        : renderStore();
    }

    $("tabs").addEventListener("click", event => {
      const button = event.target.closest("[data-tab]");
      if (!button) return;

      currentTab = button.dataset.tab;
      render();
    });

    $("panel").addEventListener("click", event => {
      const button = event.target.closest("[data-act]");
      if (!button) return;

      const action = button.dataset.act;
      const id = button.dataset.id;

      if (action === "beli") {
        const item = (LP.HADIAH || []).find(entry => String(entry.id) === String(id));
        if (!item) {
          showToast("Hadiah tidak ditemukan.", "error");
          return;
        }

        pendingItem = item;

        $("modalTitle").textContent = `Tukar ${item.nama}?`;
        $("modalDesc").innerHTML = `
          Gunakan
          <span class="font-bold text-amber-600">
            💰 ${Number(item.harga || 0)} Koin Belajar
          </span>
          untuk membuka hadiah ini.
        `;

        $("modalConfirm").classList.remove("hidden");
        return;
      }

      if (action === "pakai") {
        try {
          LP.pakai(id);
          showToast("Berhasil dipasang ke profil! ✨");
          render();
        } catch (error) {
          showToast("Hadiah belum bisa dipasang. Coba lagi.", "error");
        }
        return;
      }

      if (action === "lepas") {
        try {
          LP.lepas(button.dataset.jenis);
          showToast("Aksesori berhasil dilepas.");
          render();
        } catch (error) {
          showToast("Aksesori belum bisa dilepas. Coba lagi.", "error");
        }
      }
    });

    $("modalBtnConfirm").addEventListener("click", async () => {
      if (!pendingItem) return;

      const item = pendingItem;
      const confirmButton = $("modalBtnConfirm");

      confirmButton.disabled = true;
      confirmButton.textContent = "Memproses...";

      try {
        const result = await Promise.resolve(LP.beli(item.id));

        $("modalConfirm").classList.add("hidden");

        if (result && result.ok) {
          showToast(`${item.nama} berhasil didapatkan! 🎉`);
        } else {
          showToast(
            (result && result.pesan) || "Koin Belajar belum mencukupi.",
            "error"
          );
        }

        if (LP.loadFromServer) {
          try {
            await LP.loadFromServer();
          } catch (error) {
            // Tampilan tetap diperbarui dari data yang tersedia.
          }
        }

        render();
      } catch (error) {
        showToast("Penukaran gagal. Silakan coba lagi.", "error");
      } finally {
        pendingItem = null;
        confirmButton.disabled = false;
        confirmButton.textContent = "Tukar Sekarang! ✨";
      }
    });

    $("modalBtnCancel").addEventListener("click", () => {
      pendingItem = null;
      $("modalConfirm").classList.add("hidden");
    });

    $("modalConfirm").addEventListener("click", event => {
      if (event.target === $("modalConfirm")) {
        pendingItem = null;
        $("modalConfirm").classList.add("hidden");
      }
    });

    render();

    if (LP.loadFromServer) {
      LP.loadFromServer()
        .then(render)
        .catch(error => {
          console.error("Gagal memuat saldo terbaru:", error);
        });
    }
  })();
  </script>
</body>
</html>
