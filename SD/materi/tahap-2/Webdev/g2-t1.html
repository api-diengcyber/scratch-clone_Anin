<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materi: Kenalan dengan 3D • Dieng Cyber Coding</title>
<link rel="stylesheet" href="/shared/css/materi-3d.css?v=20261019">
  <script src="/shared/js/auth-guard.js?v=20261019"></script>
</head>
<body>
<div class="top"><img src="/Assets/logo.webp" alt="Logo Dieng Cyber" onerror="this.style.display='none'"><b>🧊 Materi • Kenalan dengan 3D</b><a href="/belajar.html?task=g2-t1">← Kembali</a></div>
<div class="player">
  <div class="bar"><i id="fill"></i></div>
  <section class="scene s1"><h2>Kenalan dengan 3D</h2><div class="stage"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div></section>
  <section class="scene s2"><h2>Tiga Ukuran Benda 3D</h2><div class="stage"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="chips"><span class="chip">↔️ Lebar</span><span class="chip">↕️ Tinggi</span><span class="chip">⤢ Panjang</span></div></section>
  <section class="scene s3"><h2>Tambah Benda</h2><div class="mock"><div class="tb"><span>🟦 Balok</span><span>⚪ Bola</span><span>🥫 Tabung</span></div><div class="vp"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><span class="hand">👆</span></div></section>
  <section class="scene s4"><h2>Putar Pandanganmu</h2><div class="mock"><div class="vp" style="height:190px"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><span class="hand">👆</span></div></section>
  <section class="scene s5"><h2>Dekat dan Jauh</h2><div class="mock"><div class="vp" style="height:190px"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div><div class="wheel">🖱️</div></section>
  <section class="scene s6"><h2>Kamu Siap! 🎉</h2><ul class="check"><li>✅ Tambah 1 benda</li><li>✅ Putar pandanganmu</li></ul><a class="go" href="/tools/Editor3D/index.html?task=g2-t1">Mulai Task 1 🧊</a></section>
  <div class="cap" id="cap"></div>
  <div class="ctl"><button id="prev">◀</button><button id="play" class="on">⏸ Jeda</button><button id="next">▶</button><span class="dots" id="dots"></span><button id="voice">🔇 Suara</button></div>
</div>
<script>
const say=["Halo! Hari ini kita kenalan dengan dunia 3D. Yuk, kita mulai!",
"Benda 3D punya tiga ukuran: lebar, tinggi, dan panjang. Karena itu bendanya terlihat nyata, seperti mainan balok.",
"Untuk menambah benda, klik tombol Balok di bagian atas editor. Hore, satu balok sudah muncul!",
"Mau lihat dari sisi lain? Tahan klik di dunia 3D, lalu geser mouse-nya. Dunianya ikut berputar.",
"Putar roda mouse untuk mendekat dan menjauh. Coba lihat bendamu dari dekat dan dari jauh!",
"Kamu sudah siap! Tambah satu balok dan putar pandanganmu, maka misi pertamamu selesai. Klik tombol hijau untuk mulai."];
const sc=[...document.querySelectorAll(".scene")],cap=document.getElementById("cap"),fill=document.getElementById("fill"),dots=document.getElementById("dots");
let i=0,t,playing=true,voice=false;
sc.forEach(()=>dots.appendChild(document.createElement("i")));
function go(n){
  i=Math.max(0,Math.min(sc.length-1,n));
  sc.forEach((s,k)=>s.classList.toggle("on",k===i)); [...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i));
  cap.textContent=say[i]; clearTimeout(t); fill.classList.remove("run"); void fill.offsetWidth;
  if(playing&&i<sc.length-1){fill.classList.add("run");t=setTimeout(()=>go(i+1),8000)}
  if("speechSynthesis" in window){speechSynthesis.cancel();if(voice){const u=new SpeechSynthesisUtterance(say[i]);u.lang="id-ID";u.rate=.95;speechSynthesis.speak(u)}}
}
document.getElementById("prev").onclick=()=>go(i-1);document.getElementById("next").onclick=()=>go(i+1);
document.getElementById("play").onclick=function(){playing=!playing;this.textContent=playing?"⏸ Jeda":"▶ Putar";this.classList.toggle("on",playing);go(i)};
document.getElementById("voice").onclick=function(){voice=!voice;this.textContent=voice?"🔊 Suara":"🔇 Suara";this.classList.toggle("on",voice);go(i)};
go(0);
</script>
  <script src="/shared/js/icons.js?v=20261019"></script>
<script src="/shared/js/materi-gate.js?v=20261019"></script>
</body>
</html>
