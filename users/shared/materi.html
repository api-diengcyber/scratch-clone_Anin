<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="/shared/js/theme.js?v=20261019"></script>
<title>Materi • Dieng Cyber Coding</title>
<meta name="description" content="Halaman materi Dieng Cyber Coding: baca ringkasan, teori singkat, dan langkah praktik sebelum mengerjakan task.">
  <link rel="icon" type="image/webp" href="/Assets/logo.webp">
<style>
:root{--c:#4361ee;--bd:#e2e8f0;--ink:#0f172a}*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",Arial,sans-serif;background:#f1f5f9;color:var(--ink);line-height:1.7;padding:64px 14px 30px}
.back{position:fixed;top:12px;left:12px;z-index:5;text-decoration:none;background:#fff;color:var(--c);padding:8px 14px;border-radius:12px;font-weight:700;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.12);border:1px solid var(--bd)}
.box{max-width:860px;margin:0 auto;background:#fff;border:1px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.hd{background:linear-gradient(135deg,var(--c),#1e1b4b);color:#fff;padding:34px 30px;text-align:center}
.bdg{display:inline-block;background:rgba(255,255,255,.2);padding:5px 14px;border-radius:30px;font-size:.8rem;font-weight:700;margin-bottom:10px}
.hd h1{font-size:1.8rem;line-height:1.25}.hd p{opacity:.9;margin-top:6px}
.ct{padding:28px 30px}h2{font-size:1.2rem;margin:26px 0 12px}h2:first-child{margin-top:0}
.card{background:#f8fafc;border:1px solid var(--bd);border-radius:14px;padding:18px 20px}
.key{background:#eef2ff;border-left:5px solid var(--c);border-radius:0 14px 14px 0;padding:12px 18px;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chips span{background:#e0e7ff;color:#3730a3;font:600 .82rem monospace;padding:4px 10px;border-radius:8px}
.st{display:flex;gap:14px;border:2px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s}
.st.ok{border-color:#10b981;background:#ecfdf5}.st.ok .n{background:#10b981}
.n{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.tip{background:#fff7ed;border-left:5px solid #f59e0b;border-radius:0 14px 14px 0;padding:12px 18px;margin:10px 0}
.prog{height:8px;background:#e2e8f0;border-radius:8px;overflow:hidden;margin-bottom:12px}.prog i{display:block;height:100%;width:0;background:#10b981;transition:.3s}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:24px}
.nav a{flex:1;min-width:150px;text-align:center;text-decoration:none;font-weight:700;padding:12px;border-radius:12px;background:#eef2ff;color:var(--c)}.nav a.go{background:var(--c);color:#fff}
</style>  <script src="/shared/js/auth-guard.js?v=20261019"></script>
</head><body>
<a class="back" id="back" href="/belajar-smp.html">← Kembali</a>
<div class="box" id="app"><div class="ct">Memuat materi…</div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search),g=q.get("g")==="smak"?"smak":"smp",pid=q.get("p"),ti=+q.get("t")||0;
  var s=document.createElement("script");s.src=g==="smak"?"/kurikulum/data/jalur-data-smak.js":"/kurikulum/data/jalur-data-smp.js";
  s.onload=function(){
    var D=g==="smak"?window.LP_SMAK:window.LP_SMP,tr,nd;
    D.forEach(function(t){t.nodes.forEach(function(n){if(n.id===pid){tr=t;nd=n}})});
    var app=document.getElementById("app"),page=g==="smak"?"/belajar-smk.html":"/belajar-smp.html";
    if(!nd||!nd.tasks[ti]){app.innerHTML='<div class="ct">Materi tidak ditemukan.</div>';return}
    var k=nd.tasks[ti],kb=q.get("kembali"),home=page+"?p="+nd.id;
    document.getElementById("back").href=(kb&&/^[\w.-]+\.html(\?[\w=&.:%-]*)?$/.test(kb)?"/"+kb:home);
    document.documentElement.style.setProperty("--c",tr.c);document.title="Materi: "+k.judul;
    var e=function(t){return String(t).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})};
    var idx=ti+1,tot=nd.tasks.length,prev=nd.tasks[ti-1],next=nd.tasks[ti+1];
    var lk=function(i){return nd.tasks[i]&&!nd.tasks[i].kumpul?"materi.html?g="+g+"&p="+nd.id+"&t="+i+"&kembali="+encodeURIComponent(kb||home):""};
    var lv={Pemula:"Pelan-pelan dan teliti: jalankan setiap langkah satu per satu, jangan dilompati.",Menengah:"Coba tebak hasilnya dulu sebelum menjalankan, lalu bandingkan dengan hasil sebenarnya.",Lanjut:"Pecah pekerjaan jadi bagian kecil, uji tiap bagian, baru gabungkan."}[nd.level]||"";
    var h='<div class="hd"><span class="bdg">'+e(tr.nama)+' • '+e(nd.title)+'</span><h1>'+(k.project?"🏆 ":"")+e(k.judul)+'</h1><p>'+(k.project?"Project akhir modul":"Task "+idx+" dari "+tot)+' • Pertemuan '+e(nd.pertemuan)+' • '+e(nd.level)+'</p></div><div class="ct">';
    h+='<h2>📖 Ringkasan</h2><div class="card"><p>'+e(nd.ringkasan)+'</p></div>';
    h+='<h2>🔑 Konsep Kunci</h2>'+nd.teori.map(function(x){return'<div class="key">'+e(x)+'</div>'}).join("")+'<div class="chips">'+nd.materi.map(function(x){return'<span>'+e(x)+'</span>'}).join("")+'</div>';
    h+='<h2>🎯 Tujuan Task Ini</h2><div class="card"><p>Setelah mengerjakan <b>'+e(k.judul)+'</b>, kamu mampu menyelesaikan '+k.langkah.length+' langkah praktik dan memakai konsep di atas pada hasil karyamu sendiri.</p></div>';
    h+='<h2>🛠️ Langkah Praktik <small style="font-weight:500;color:#64748b">(klik untuk menandai)</small></h2><div class="prog"><i id="pg"></i></div>'+k.langkah.map(function(x,i){return'<div class="st"><div class="n">'+(i+1)+'</div><div><b>Langkah '+(i+1)+'</b><br>'+e(x)+'</div></div>'}).join("");
    h+='<h2>💡 Tips Mengerjakan</h2><div class="tip">'+e(lv)+'</div><div class="tip">Kalau hasilnya belum sesuai, baca ulang langkah yang terlewat, perbaiki satu hal, lalu uji lagi. Tulis hasil dan catatanmu di editor.</div>';
    h+='<div class="nav">'+(lk(ti-1)?'<a href="'+lk(ti-1)+'">← '+e(prev.judul)+'</a>':"")+'<a class="go" href="'+e(nd.urlEditor)+'?'+g.replace("smak","smp")+'='+nd.id+'&t='+ti+'">Buka Editor →</a>'+(lk(ti+1)?'<a href="'+lk(ti+1)+'">'+e(next.judul)+' →</a>':"")+'</div></div>';
    app.innerHTML=h;
    var st=[].slice.call(app.querySelectorAll(".st")),pg=document.getElementById("pg");
    st.forEach(function(el){el.onclick=function(){el.classList.toggle("ok");pg.style.width=Math.round(app.querySelectorAll(".st.ok").length/st.length*100)+"%"}});
  };
  document.head.appendChild(s);
})();
</script></body></html>
