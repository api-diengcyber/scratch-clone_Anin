<!DOCTYPE html>
<html lang="id" data-dark="manual">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/shared/js/theme.js?v=20261019"></script>
  <title>Ganti Password • Dieng Cyber Coding Academy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/webp" href="/Assets/logo.webp">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #f5f8ff; color: #25324a; padding: 20px; }
    .card { width: 100%; max-width: 400px; background: #fff; border: 1px solid #e3e8f3; border-radius: 22px; padding: 30px; box-shadow: 0 8px 25px rgba(50,70,110,.08); }
    .brand { text-align: center; margin-bottom: 18px; }
    .brand-icon { width: 54px; height: 54px; margin: 0 auto 10px; border-radius: 16px; background: #fff; display: grid; place-items: center; overflow: hidden; }
    .brand-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
    h1 { margin: 0; font-size: 19px; letter-spacing: .5px; }
    p.sub { margin: 4px 0 0; color: #8791a5; font-size: 12px; }
    label { display: block; margin: 14px 0 6px; font-size: 12px; font-weight: bold; }
    input { width: 100%; padding: 12px; border: 1px solid #d9e0f0; border-radius: 12px; font: inherit; }
    input:focus { outline: 2px solid #7181ec; border-color: transparent; }
    .hint { margin: 6px 0 0; color: #8791a5; font-size: 11px; }
    .msg { display: none; margin-top: 12px; font-size: 12px; }
    .msg.error { color: #d33; }
    .msg.ok { color: #127a3f; }
    .btn-submit { width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 12px; background: #7181ec; color: #fff; font: inherit; font-weight: bold; cursor: pointer; }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }
    .btn-submit:hover:not(:disabled) { background: #5f70dd; }
    .footer { text-align: center; margin-top: 18px; font-size: 12px; color: #8791a5; }
    .footer a { color: #7181ec; text-decoration: none; font-weight: bold; }
  </style>
  <link rel="stylesheet" href="/shared/css/dark.css?v=20261022">
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon"><img src="/Assets/logo.webp" alt="Logo Dieng Cyber" width="256" height="256"></div>
      <h1>GANTI PASSWORD</h1>
      <p class="sub">Akun ini memakai password sementara. Buat password baru sebelum melanjutkan.</p>
    </div>

    <form id="pwForm" novalidate>
      <label for="currentPassword">Password saat ini</label>
      <input type="password" id="currentPassword" autocomplete="current-password" required>

      <label for="newPassword">Password baru</label>
      <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
      <p class="hint">Minimal 8 karakter. Gunakan kombinasi huruf, angka, atau simbol.</p>

      <label for="confirmPassword">Ulangi password baru</label>
      <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required>

      <div id="msg" class="msg" role="alert"></div>
      <button type="submit" id="submitBtn" class="btn-submit">Simpan Password Baru</button>
    </form>

    <div class="footer">
      <a href="/index.html" id="logoutLink">Keluar dan kembali ke halaman masuk</a>
    </div>
  </div>

<script type="module">
  const form = document.getElementById("pwForm");
  const msg = document.getElementById("msg");
  const submitBtn = document.getElementById("submitBtn");
  const currentInput = document.getElementById("currentPassword");
  const newInput = document.getElementById("newPassword");
  const confirmInput = document.getElementById("confirmPassword");
  const logoutLink = document.getElementById("logoutLink");

  function token() {
    try { return localStorage.getItem("authToken") || ""; } catch (_) { return ""; }
  }

  function clearAuth() {
    for (const key of ["authToken", "isLoggedIn", "username", "email", "scratch_user"]) {
      try { localStorage.removeItem(key); } catch (_) {}
    }
  }

  function show(text, kind) {
    msg.textContent = text;
    msg.className = "msg " + (kind || "error");
    msg.style.display = "block";
  }

  function targetFor(role) {
    return role === "admin" ? "/admin/" : "/dashboard.html";
  }

  async function me() {
    const response = await fetch("/api/auth/me", {
      headers: { Authorization: "Bearer " + token() },
      cache: "no-store"
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const err = new Error(data.message || "Sesi tidak valid.");
      err.status = response.status;
      throw err;
    }
    return data;
  }

  if (!token()) {
    window.location.replace("/index.html");
  } else {
    me().then((user) => {
      if (!user.mustChangePassword) window.location.replace(targetFor(user.role));
    }).catch(() => {
      clearAuth();
      window.location.replace("/index.html");
    });
  }

  logoutLink.addEventListener("click", async (event) => {
    event.preventDefault();
    try {
      await fetch("/api/auth/logout", {
        method: "POST",
        headers: { Authorization: "Bearer " + token() }
      });
    } catch (_) {}
    clearAuth();
    window.location.replace("/index.html");
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (submitBtn.disabled) return;

    if (!currentInput.value) return show("Password saat ini wajib diisi.");
    if (newInput.value.length < 8) return show("Password baru minimal 8 karakter.");
    if (newInput.value !== confirmInput.value) return show("Ulangi password baru dengan benar.");
    if (newInput.value === currentInput.value) return show("Password baru harus berbeda dari password saat ini.");

    submitBtn.disabled = true;
    msg.style.display = "none";
    try {
      const response = await fetch("/api/auth/change-password", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token()
        },
        body: JSON.stringify({
          currentPassword: currentInput.value,
          newPassword: newInput.value
        })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const err = new Error(data.message || "Gagal menyimpan password.");
        err.status = response.status;
        throw err;
      }
      show("Password berhasil diubah. Mengalihkan...", "ok");
      const user = await me().catch(() => ({}));
      setTimeout(() => window.location.replace(targetFor(user.role)), 900);
    } catch (error) {
      submitBtn.disabled = false;
      if (error.status === 401) return show("Password saat ini salah.");
      if (error.status === 429) return show("Terlalu banyak percobaan. Coba lagi 15 menit lagi.");
      show(error.message || "Gagal menyimpan password.");
    }
  });
</script>
</body>
</html>
