<!DOCTYPE html>
<html lang="id" data-dark="manual">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/shared/js/theme.js?v=20261019"></script>
  <title>Masuk • Dieng Cyber Coding Academy</title>
  <meta name="description" content="Masuk ke Dieng Cyber Coding Academy dan lanjutkan belajar koding: Scratch, web, Python, dan 3D untuk siswa SD, SMP, dan SMA/SMK.">
  <link rel="icon" type="image/webp" href="/Assets/logo.webp">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #f5f8ff; color: #25324a; padding: 20px; }
    .card { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e3e8f3; border-radius: 22px; padding: 30px; box-shadow: 0 8px 25px rgba(50,70,110,.08); }
    .brand { text-align: center; margin-bottom: 20px; }
    .brand-icon { width: 54px; height: 54px; margin: 0 auto 10px; border-radius: 16px; background: #fff; display: grid; place-items: center; font-size: 28px; overflow: hidden; }
    .brand-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
    h1 { margin: 0; font-size: 19px; letter-spacing: .5px; }
    p { margin: 4px 0 0; color: #8791a5; font-size: 12px; }
    label { display: block; margin: 14px 0 6px; font-size: 12px; font-weight: bold; }
    input { width: 100%; padding: 12px; border: 1px solid #d9e0f0; border-radius: 12px; font: inherit; }
    input:focus { outline: 2px solid #7181ec; border-color: transparent; }
    
    /* Wrapper untuk input password dan tombol toggle */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-wrapper input {
      padding-right: 44px;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      width: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8791a5;
    }
    .toggle-password:hover {
      background: none;
      color: #556075;
    }

    .error { display: none; margin-top: 12px; color: #d33; font-size: 12px; }
    .btn-submit { width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 12px; background: #7181ec; color: #fff; font: inherit; font-weight: bold; cursor: pointer; }
    .btn-submit:hover { background: #5f70dd; }

    /* Footer link untuk registrasi */
    .register-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #8791a5;
    }
    .register-link a {
      color: #7181ec;
      text-decoration: none;
      font-weight: bold;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
  <link rel="stylesheet" href="/shared/css/dark.css?v=20261022">
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon"><img src="Assets/logo.webp" alt="Logo Dieng Cyber" width="256" height="256"></div>
      <h1>DIENG CYBER CODING</h1>
      <p>Masuk untuk mulai belajar coding</p>
    </div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Masukkan Email" autocomplete="email" autocapitalize="none" spellcheck="false" required>

      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
        <button type="button" id="togglePassword" class="toggle-password" aria-label="Tampilkan atau sembunyikan password">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <div id="loginError" class="error">Email dan Password wajib diisi!</div>

      <button type="submit" class="btn-submit">Masuk</button>
    </form>

    <!-- Navigasi Belum Punya Akun -->
    <div class="register-link">
      Belum punya akun? <a href="register.html">Daftar sekarang</a>
    </div>
  </div>
<script type="module">
  const loginForm = document.getElementById("loginForm");
  const loginError = document.getElementById("loginError");
  const passwordInput = document.getElementById("password");
  const togglePassword = document.getElementById("togglePassword");
  const eyeIcon = document.getElementById("eyeIcon");

  // ======================================================
  // TOGGLE SHOW / HIDE PASSWORD
  // ======================================================

  togglePassword.addEventListener("click", function () {
    const isPassword =
      passwordInput.getAttribute("type") === "password";

    passwordInput.setAttribute(
      "type",
      isPassword ? "text" : "password"
    );

    if (isPassword) {
      eyeIcon.innerHTML = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      `;
    } else {
      eyeIcon.innerHTML = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      `;
    }
  });

  // ======================================================
  // LOGIN
  // ======================================================

  loginForm.addEventListener("submit", async function (e) {
    e.preventDefault();

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      passwordInput.value;

    loginError.style.display = "none";

    if (!email || !password) {
      loginError.textContent =
        "Email dan password wajib diisi.";

      loginError.style.display =
        "block";

      return;
    }

    try {
      // ==================================================
      // LOGIN DATABASE
      // ==================================================

      const response =
        await fetch(
          "/api/auth/login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                email,
                password
              })
          }
        );

      const data =
        await response
          .json()
          .catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.message ||
          "Login gagal."
        );
      }

      const username =
        data.username || email;

      // ==================================================
      // SIMPAN SESSION BACKEND
      // ==================================================

      localStorage.setItem(
        "isLoggedIn",
        "true"
      );

      localStorage.setItem(
        "username",
        username
      );

      localStorage.setItem(
        "email",
        data.email || email
      );

      localStorage.setItem(
        "scratch_user",
        username
      );

      localStorage.setItem(
        "authToken",
        data.token
      );

      // ==================================================
      // WAJIB GANTI PASSWORD (akun baru)
      // ==================================================

      if (data.mustChangePassword) {
        window.location.replace(
          "/ganti-password.html"
        );
        return;
      }

      // ==================================================
      // MASUK DASHBOARD
      // ==================================================

      window.location.replace(
        data.role === "admin"
          ? "/admin/"
          : "/dashboard.html"
      );

    } catch (error) {
      console.error(
        "Login error:",
        error
      );

      let message =
        error.message ||
        "Login gagal.";

      if (
        error instanceof TypeError
      ) {
        message =
          "Backend tidak dapat dihubungi. Coba lagi.";
      }

      loginError.textContent =
        message;

      loginError.style.display =
        "block";
    }
  });
</script>
</body>
</html>
